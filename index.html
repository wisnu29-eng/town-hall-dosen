<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<div class="app">

      <div class="live__src" id="src">Google Sheets</div>
    </div>
  </aside>

  <main>
    <div class="stage" id="stage" aria-live="polite">
      <div class="boot">Memuat data…</div>
    </div>
  </main>
</div>

<div class="banner" id="banner" hidden>
  <span id="bannerText">Menghubungkan…</span>
  <button type="button" id="bannerRetry">Coba lagi</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
